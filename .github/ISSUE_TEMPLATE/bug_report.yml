name: Bug report
description: Report a reproducible skill, installation or production problem.
title: '[Bug] '
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: Include the requested output and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a minimal fictional or shareable example. Exclude private media, credentials and signed URLs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent, OS, skill version and relevant tools
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks, errors and permitted artifacts
      description: Distinguish render, technical, visual and listening evidence.
